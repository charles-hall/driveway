<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Driveway">
<title>Bedford Driveway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column; vehicle switcher strip, spec plate, then a service table that collapses to cards on phones. Inventory is a second view. */
/* Single dark look by design: black ground, dark grey panels, deep red accent. */
:root{
  --bg:#0a0a0a; --surface:#1c1c1e; --ink:#ececec; --muted:#9a9a9e; --line:#2e2e31;
  --accent:#9e1b24; --accent-text:#d9434c; --accent-ink:#ffffff; --accent-soft:#3a1215;
  --ok:#6cc391; --warn:#e0605f; --chip:#2a2a2d;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font:700 2rem/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
h1 span{color:var(--accent-text)}
h2{font:700 1.5rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
.views{display:flex;background:var(--chip);border-radius:8px;padding:3px}
.views button{border:0;background:transparent;color:var(--muted);font:600 .85rem var(--body);padding:7px 14px;border-radius:6px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;text-align:left;font:inherit}
.tab b{display:block;font:700 1.1rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.tab small{color:var(--muted);font-size:.78rem}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent-text)}
.tab.add{border-style:dashed;color:var(--muted);font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.plate{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.plate-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.plate-title{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
.car-art{width:clamp(150px,28vw,220px);height:auto;flex:none}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ov-card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s,transform .15s}
.ov-card:hover{border-color:var(--accent)}
.ov-card:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.ov-card:hover{transform:translateY(-2px)}}
.ov-card .car-art{width:100%;max-width:280px;align-self:center}
.ov-plate{display:flex;justify-content:center;margin:-4px 0 4px}
.lplate{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#f4f4f2;color:#1d3f8f;border:2px solid #c9c9c6;border-radius:6px;padding:2px 10px 3px;min-width:96px;box-shadow:inset 0 0 0 2px #fff,0 1px 2px rgb(0 0 0/.4);flex:none}
.lplate-state{font:700 .5rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#b0222a}
.lplate-num{font:700 1.15rem/1.1 var(--display);letter-spacing:.08em}
.ov-stats .span2{grid-column:1/-1}
.ov-name{font:700 1.3rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--ink)}
.ov-sub{color:var(--muted);font-size:.85rem}
.ov-chips{display:flex;gap:6px;flex-wrap:wrap}
.ov-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:6px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.ov-stats dt{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ov-stats dd{margin:0;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ov-stats dd small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
#main{display:flex;flex-direction:column;gap:16px;min-width:0}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px;margin:0}
.specs div{min-width:0}
.specs dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.specs dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:.9em}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 12px;font:600 .82rem var(--body);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary:hover{background:#b8222c;border-color:#b8222c}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--accent-text)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.item{font-weight:600;white-space:nowrap}
td.notes{color:var(--muted);font-size:.88rem;max-width:280px}
.when{white-space:nowrap}
.when small{display:block;color:var(--muted);font-size:.76rem}
.links{display:flex;gap:6px;flex-wrap:wrap}
.links a,.chip{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--ink);text-decoration:none;white-space:nowrap}
.links a:hover{background:var(--accent-soft)}
.chip.stock{background:var(--accent-soft);color:var(--ink)}
.chip.restock{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.due{white-space:nowrap}
.due small{display:block;color:var(--muted);font-size:.76rem;white-space:normal;max-width:190px}
.chip.over{background:var(--accent);color:var(--accent-ink)}
.chip.soon{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.chip.ok{background:transparent;border:1px solid var(--line);color:var(--ok)}
.chip.none{background:var(--chip);color:var(--muted)}
.chip.skipped{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.upcoming{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.upcoming ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.upcoming li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:.9rem}
.upcoming li .who{color:var(--muted);font-size:.8rem}
.upcoming button.link{border:0;background:none;color:var(--ink);font:600 .9rem var(--body);padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.form-hint{margin:-6px 0 0;font-size:.78rem;color:var(--muted)}
.cat-row th{background:var(--chip);color:var(--ink);font:700 .95rem var(--display);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;text-align:left}
.cat-row th span{color:var(--muted);font:500 .75rem var(--body);letter-spacing:0;margin-left:6px}
.cat-nav{display:flex;flex-wrap:wrap;gap:6px}
.cat-nav .chip{border:1px solid var(--line);cursor:pointer;font-size:.8rem;padding:4px 10px}
.cat-nav .chip:hover{border-color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.inv-group{display:flex;flex-direction:column;gap:10px}
.inv-group h3.cat{margin:0;font:700 1.05rem var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.inv-line .used{grid-column:1/-1;font-size:.78rem;color:var(--muted)}
.inv-card .card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.veh-link{display:grid;grid-template-columns:auto 1fr 90px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.veh-link label{display:flex;gap:6px;align-items:center;font-weight:600;font-size:.9rem;white-space:nowrap}
.veh-link select,.veh-link input[type=text],.f select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
@media (max-width:520px){.veh-link{grid-template-columns:1fr 80px}.veh-link label{grid-column:1/-1}}
.hist td{font-size:.88rem}
.hist td.date{white-space:nowrap;font-variant-numeric:tabular-nums}
.hist td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.shop li{margin:2px 0}
.shop .links{display:inline-flex;margin-left:6px;vertical-align:middle}
.shop-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.inv-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.inv-card h3{margin:0;font:700 1.15rem var(--display);text-transform:uppercase;letter-spacing:.03em}
.inv-line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start;padding-top:10px;border-top:1px solid var(--line)}
.inv-line .nm{font-weight:600;font-size:.9rem}
.inv-line .sp{grid-column:1/-1;color:var(--muted);font-size:.8rem;font-family:var(--mono);overflow-wrap:anywhere}
.inv-line input{width:100%;grid-column:1/-1}
.restock-toggle{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);grid-column:1/-1;cursor:pointer}
.shop{background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.shop ul{margin:0;padding-left:18px}
input[type=text],input[type=url],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
label.f input,label.f textarea{text-transform:none;letter-spacing:0;font-weight:400;font-size:.95rem}
.modal-back{position:fixed;inset:0;background:rgb(0 0 0/.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto;z-index:10}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.modal-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.status{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.85rem;font-weight:600;z-index:20;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px)}
.toast button{border:0;background:transparent;color:var(--accent);font:700 .85rem var(--body);cursor:pointer;padding:2px 4px;text-decoration:underline}
@media (max-width:720px){
  .svc thead{display:none}
  .svc tr.cat-row{display:block;padding:0;border-bottom:0}
  .svc tr.cat-row th{display:block}
  .svc tr:not(.cat-row){display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .svc tr:last-child{border-bottom:0}
  .svc td{border:0;padding:0}
  .svc td.item{grid-column:1}
  .svc td.when{grid-column:2;grid-row:1;text-align:right}
  .svc td.spec,.svc td.due,.svc td.notes,.svc td.onhand,.svc td.lk,.svc td.act{grid-column:1/-1;max-width:none}
  .svc td:empty{display:none}
  .form-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* touch: full-size tap targets for the view switcher and vehicle tabs */
.views button,.tab,.btn,.chip-jump,[data-jump]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.views button{min-height:40px;min-width:44px;position:relative}
@media (max-width:640px){
  header.top{flex-direction:column;align-items:stretch}
  .views{width:100%;padding:4px;gap:4px}
  .views button{flex:1 1 0;min-height:44px;font-size:.95rem;padding:10px 8px}
  .tab{min-height:44px}
}
/* server build: settings view */
.tabs[hidden]{display:none!important}
.set-people li .set-who{flex:1 1 180px}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.set-h{margin:0;font:700 1.3rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.set-row{display:flex;flex-wrap:wrap;gap:8px}
.set-me{display:flex;align-items:center;gap:12px}
.set-me img,.set-people img,.set-av{width:40px;height:40px;border-radius:50%;flex:none}
.set-av{display:grid;place-items:center;background:var(--chip);font-weight:600}
.set-who{display:flex;flex-direction:column;min-width:0;flex:1}
.set-who small{color:var(--muted);overflow-wrap:anywhere}
.set-prefs{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.set-prefs legend{font-weight:600;margin-bottom:6px}
.set-pref{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.set-pref input{margin:3px 0 0;flex:none;accent-color:var(--accent);width:18px;height:18px}
.set-pref span{display:flex;flex-direction:column}
.set-pref small{color:var(--muted)}
.set-people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.set-people li{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.set-people select,.set-invite select,.set-invite input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font:inherit}
.set-invite{display:flex;flex-wrap:wrap;gap:8px}
.set-invite input{flex:1 1 200px;min-width:0}
.plate p{margin:0}
.plate a{color:var(--accent-text)}
</style>

<div class="wrap">
  <header class="top">
    <h1>Bedford <span>Driveway</span></h1>
    <div class="views" role="group" aria-label="View">
      <button id="v-service" aria-pressed="true">Maintenance</button>
      <button id="v-inv" aria-pressed="false">Inventory</button>
      <button id="v-set" aria-pressed="false" aria-label="Settings">Settings</button>
    </div>
  </header>
  <div class="tabs" id="tabs" role="tablist" aria-label="Vehicles"></div>
  <main id="main"><div class="plate empty">Loading your vehicles…</div></main>
  <p class="status" id="status"></p>
</div>
<div id="modal-root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script>
/* Server bridge: gives the app the same small data API it used inside Claude
   (collection/doc, onSnapshot, set/update/delete), backed by this server's /api.
   Changes from other people show up within about 20 seconds, or right away
   when the app is reopened. */
(function () {
  const COLS = ["vehicles", "parts", "history"];
  const listeners = { vehicles: [], parts: [], history: [] };
  let cache = null, version = null, me = null;

  async function api(method, url, body) {
    const r = await fetch(url, {
      method, credentials: "same-origin",
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (r.status === 401) { location.href = "/login"; throw { code: "signed_out", message: "Signed out" }; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw { code: r.status === 403 ? "invalid_argument" : "unavailable", message: j.error || r.statusText };
    return j;
  }

  function emit(col) {
    const docs = (cache?.[col] || []).map(d => { const { id, ...b } = d; return { id, exists: true, data: () => b }; });
    listeners[col].forEach(l => {
      let ds = docs;
      if (l.order) ds = [...docs].sort((a, b) => (a.data()[l.order] ?? Infinity) - (b.data()[l.order] ?? Infinity));
      try { l.next({ docs: ds, size: ds.length, empty: !ds.length }); } catch (e) { console.error(e); }
    });
  }

  async function refresh(force) {
    try {
      if (!force && cache) { const v = await api("GET", "/api/version"); if (v.version === version) return; }
      const s = await api("GET", "/api/state");
      version = s.version; cache = s;
      COLS.forEach(emit);
    } catch (e) { if (e.code !== "signed_out") console.warn("refresh failed", e); }
  }

  const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

  function docRef(col, id) {
    return {
      id, path: col + "/" + id,
      async set(body) { await api("PUT", `/api/${col}/${encodeURIComponent(id)}`, body); await refresh(true); },
      async update(body) {
        const cur = (cache?.[col] || []).find(d => d.id === id);
        if (!cur) throw { code: "invalid_argument", message: "Not found" };
        const { id: _, ...b } = cur; await this.set({ ...b, ...body });
      },
      async delete() { await api("DELETE", `/api/${col}/${encodeURIComponent(id)}`); await refresh(true); },
      async get() { const d = (cache?.[col] || []).find(x => x.id === id); const { id: _, ...b } = d || {}; return { id, exists: !!d, data: () => (d ? b : undefined) }; },
    };
  }

  function collection(col) {
    const base = {
      _order: null,
      orderBy(f) { const n = Object.create(base); n._order = f; return n; },
      doc(id) { return docRef(col, id || rid()); },
      onSnapshot(next) {
        const l = { next, order: this._order };
        listeners[col].push(l);
        if (cache) setTimeout(() => emit(col), 0);
        return () => { listeners[col] = listeners[col].filter(x => x !== l); };
      },
    };
    return base;
  }

  const db = { collection, doc(path) { const [c, id] = path.split("/"); return docRef(c, id); } };

  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      return { status: "saved" };
    },
  };

  const ready = Promise.all([api("GET", "/api/me").then(m => { me = m; }), refresh(true)]);

  setInterval(() => { if (document.visibilityState === "visible") refresh(false); }, 20000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(false); });

  window.claude = {
    async use(name) {
      if (name === "db") { await ready; return db; }
      if (name === "user") { await ready; return { can: async () => me.role !== "viewer", isOwner: () => me.role === "owner" }; }
      if (name === "downloads") return downloads;
      return null;
    },
  };
  window.DRIVEWAY = { get me() { return me; }, set me(v) { me = v; }, api, refresh, ready };

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(e => console.warn("service worker", e));
})();
</script>
<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
let downloads = null, db = null, parts = [], history = [], showAllHist = false, vehicles = [], activeId = null, view = "service", canWrite = true;

try { const v = localStorage.getItem("gl-view"); if (v) view = v; } catch {}
activeId = null; /* always open on the vehicle overview */

function toast(msg, undo){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");

/* On-hand counts stay free text. Auto-subtract only when the text is one leading number plus a unit, e.g. "2", "4 qt.". */
function useStock(onHand, uses){

/* Date helpers: values stay as free text ("70,000 miles", "October 2025") but parseable dates get an age. */
function parseDate(s){
  if(!s) return null; s=String(s).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return new Date(y, m[1]-1, +m[2]); }
  m = s.match(/^(\d{1,2})\/(\d{4})$/); if(m) return new Date(+m[2], m[1]-1, 1);
  m = s.match(/^([A-Za-z]{3,})\.?\s+(\d{4})$/);
  if(m){ const i=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(m[1].slice(0,3).toLowerCase()); if(i>=0) return new Date(+m[2], i, 1); }

function age(s){
  const d=parseDate(s); if(!d) return "";

  return (mo/12).toFixed(1).replace(/\.0$/,"")+" years ago";
}

const fmtDate=d=>`${pad2(d.getMonth()+1)}/${pad2(d.getDate())}/${d.getFullYear()}`;

const fmtMi=n=>Math.round(n).toLocaleString("en-US");
function intervalText(it){
  const mo=num(it.intervalMonths), mi=num(it.intervalMiles), parts=[];
  if(mi) parts.push(fmtMi(mi)+" miles");

/* Next due = last date + months, or last odometer + miles, whichever comes first. */
function dueInfo(it, v){
  const mo=num(it.intervalMonths), mi=num(it.intervalMiles);
  if(!mo && !mi) return null;
  const skip=parseDate(it.skipUntil);
  if(skip && skip>new Date()) return {state:"skipped", label:"Skipped", detail:"until "+fmtDate(skip), sort:Infinity};
  const last=parseDate(it.lastChanged), lastMi=num(it.lastMiles), odo=num(v.odometer);
  let date=null, miles=null;
  if(mo && last){ date=new Date(last); date.setDate(date.getDate()+Math.round(mo*30.44)); }
  if(mi && lastMi!=null) miles=lastMi+mi;
  if(!date && miles==null) return {state:"none", label:"No record", detail:"Add the last date or mileage"};
  const days = date ? (date-Date.now())/864e5 : Infinity;
  const left = (miles!=null && odo!=null) ? miles-odo : Infinity;
  const state = (days<0||left<=0) ? "over" : (days<=45||left<=1000) ? "soon" : "ok";

const SVC_CATS=["Oil change","Filters","Wipers","Tires and wheels","Brakes","Engine and ignition","Fluids","Other"];
function svcCat(it){

const CATS=["Oil","Oil filters","Drain plug washers","Air filters","Wiper blades","Spark plugs","Other"];
/* Built-in categories plus any custom ones already used by a part; "Other" stays last. */
const allCats=()=>[...new Set([...CATS.filter(c=>c!=="Other"),...parts.map(p=>p.category).filter(c=>c&&c!=="Other"),"Other"])];
const catOf=p=>p.category||"Other";
/* Add the part's unit to bare numbers, e.g. "5" -> "5 qt." */
const withUnit=(val,unit)=>{ const t=String(val??"").trim(); return unit&&/^\d+(\.\d+)?$/.test(t)?`${t} ${unit}`:t; };
function usedBy(partId){
  const out=[]; vehicles.forEach(v=>(v.items||[]).forEach(it=>{ if(it.partId===partId) out.push(`${v.name}${/\((.+)\)/.test(it.name)?" "+it.name.match(/\((.+)\)/)[1]:""}${it.usesPerChange?` (${withUnit(it.usesPerChange,(parts.find(x=>x.id===partId)||{}).unit)} per change)`:""}`); }));
  return out;
}
/* Purchase links come from the maintenance items linked to a part. */
function partLinks(p){
  const seen=new Set(), out=[];
  vehicles.forEach(v=>(v.items||[]).forEach(i=>{ if(i.partId===p.id&&i.purchaseUrl&&!seen.has(i.purchaseUrl)){ seen.add(i.purchaseUrl); out.push({url:i.purchaseUrl,label:i.purchase&&i.purchase!=="Link"?i.purchase:""}); } }));
  return out;
}
function shopText(){
  return "Shopping list\n"+parts.filter(p=>p.restock).map(p=>{ const l=partLinks(p)[0]; return `- ${p.name}${p.spec?" ("+p.spec+")":""}${l?": "+l.url:""}`; }).join("\n");
}

/* ---------- writes ---------- */
async function save(v, msg){
  if(!db){ toast("Saving isn't available in this view"); return; }
  const body = {...v}; delete body.id;
  try { await db.doc("vehicles/"+v.id).set(body); if(msg) toast(msg); setStatus(""); }
  catch(e){
    if(e.code==="invalid_argument"){ canWrite=false; render(); setStatus("You have view-only access to this log."); }
    else setStatus("Couldn't save: "+(e.message||e.code)+". Try again in a moment.");
  }
}
async function savePart(p, msg){
  if(!db) return;
  const body={...p}; delete body.id;
  try{ await db.doc("parts/"+p.id).set(body); if(msg) toast(msg); setStatus(""); }
  catch(e){ setStatus("Couldn't save part: "+(e.message||e.code)+". Try again in a moment."); }
}

function openModal(html, onSubmit, onDelete){
  const root=$("#modal-root");

    <div class="modal-foot"><div>${onDelete?`<button type="button" class="btn danger" id="m-del">Delete</button>`:""}</div>
    <div class="row-actions"><button type="button" class="btn" id="m-cancel">Cancel</button><button class="btn primary" type="submit">Save</button></div></div></form></div>`;
  const close=()=>root.innerHTML="";
  $("#m-cancel").onclick=close;
  $(".modal-back").addEventListener("click",e=>{ if(e.target.classList.contains("modal-back")) close(); });
  $("#mform").addEventListener("submit",e=>{ e.preventDefault(); const fd=Object.fromEntries(new FormData(e.target)); close(); onSubmit(fd); });
  if(onDelete){ const b=$("#m-del"); b.onclick=()=>{ if(b.dataset.armed){ close(); onDelete(); } else { b.dataset.armed=1; b.textContent="Click again to delete"; } }; }
  const first=$("#mform input"); first&&first.focus();
}

function editPart(partId){
  const isNew=!partId;
  const p=isNew?{id:uid(),category:"Other",onHand:"",restock:false}:parts.find(x=>x.id===partId);
  const cats=allCats();
  const vehRows=vehicles.map(v=>{
    const linked=(v.items||[]).find(i=>i.partId===p.id);
    const opts=(v.items||[]).map(i=>{ const other=i.partId&&i.partId!==p.id?parts.find(x=>x.id===i.partId):null;
      return `<option value="${esc(i.id)}" ${linked&&linked.id===i.id?"selected":""}>${esc(i.name)}${other?" (now: "+esc(other.name)+")":""}</option>`; }).join("");
    return `<div class="veh-link">
      <label><input type="checkbox" id="veh-${esc(v.id)}" name="veh-${esc(v.id)}" ${linked?"checked":""}> ${esc(v.name)}</label>
      <select id="item-${esc(v.id)}" name="item-${esc(v.id)}" aria-label="Maintenance item on ${esc(v.name)}"><option value="__new" ${linked?"":"selected"}>New maintenance item</option>${opts}</select>
      <input type="text" id="uses-${esc(v.id)}" name="uses-${esc(v.id)}" value="${esc(linked?.usesPerChange||"1")}" aria-label="Used per replacement on ${esc(v.name)}" title="Used per replacement">
    </div>`; }).join("");
  openModal(`<h2>${isNew?"Add part":esc(p.name)}</h2><div class="form-grid">
    ${field("name","Part",p.name)}${field("spec","Spec / part number",p.spec)}
    <label class="f">Category<select id="f-category" name="category">${cats.map(c=>`<option ${c===catOf(p)?"selected":""}>${esc(c)}</option>`).join("")}<option value="__new">+ New category…</option></select></label>
    ${field("onHand","On hand",p.onHand)}${field("unit","Unit (optional, e.g. qt.)",p.unit)}
    <label class="f full" id="newcat-wrap" hidden>New category name<input type="text" id="f-newCategory" name="newCategory" placeholder="e.g. Brake pads"></label>
    <div class="full"><div class="f" style="margin-bottom:4px">Use on vehicles</div>
      <p class="form-hint" style="margin:0 0 4px">Check each vehicle that uses this part. Pick the maintenance item it's for, or add a new one. The last box is how many get used per replacement.</p>
      ${vehRows}</div></div>`,
    async fd=>{
      const category = fd.category==="__new" ? ((fd.newCategory||"").trim()||"Other") : fd.category;
      const cur=parts.find(x=>x.id===p.id)||p;
      const unit=(fd.unit||"").trim(); const np={...clone(cur),name:fd.name,spec:fd.spec,unit,onHand:withUnit(fd.onHand,unit),category};
      await savePart(np, isNew?"Part added":"Saved");
      for(const v of vehicles){
        const nv=clone(latest(v)); let changed=false;
        const on=fd["veh-"+v.id]==="on", pick=fd["item-"+v.id], uses=withUnit(fd["uses-"+v.id],unit);
        nv.items=(nv.items||[]).map(i=>{
          if(i.partId===p.id && (!on || i.id!==pick)){ changed=true; const c={...i}; delete c.partId; return c; }
          if(on && i.id===pick && (i.partId!==p.id || i.usesPerChange!==uses)){ changed=true; return {...i,partId:p.id,usesPerChange:uses}; }
          return i; });
        if(on && pick==="__new"){ changed=true; nv.items.push({id:uid(),name:np.name||"New part",spec:np.spec||"",lastChanged:"",lastMiles:"",notes:"",purchase:"",purchaseUrl:"",guideUrl:"",restock:false,partId:p.id,usesPerChange:uses}); }
        if(changed) await save(nv);
      }
    },
    isNew?null:async()=>{
      try{ await db.doc("parts/"+p.id).delete();
        for(const v of vehicles){ const nv=clone(latest(v)); let ch=false; nv.items=(nv.items||[]).map(i=>{ if(i.partId===p.id){ ch=true; const c={...i}; delete c.partId; return c; } return i; }); if(ch) await save(nv); }
        toast("Part deleted"); }catch(e){ setStatus("Couldn't delete: "+(e.message||e.code)); } });

const isoToday=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const isoToMdy=iso=>{ const [y,m,d]=iso.split("-").map(Number); return `${pad2(m)}/${pad2(d)}/${y}`; };
function logService(v,itemId){
  const it=(v.items||[]).find(i=>i.id===itemId); if(!it) return;
  const p=partOf(it), stockOk=!!(it.usesPerChange&&useStock(p?p.onHand:it.onHand,it.usesPerChange));
  openModal(`<h2>Log service: ${esc(it.name)}</h2><p class="form-hint" style="margin:0">${esc(v.name)}${p?` · uses ${esc(p.name)}`:""}</p><div class="form-grid">
    ${field("date","Date",isoToday(),"","date")}${field("miles","Mileage",v.odometer||"")}
    ${field("cost","Cost ($, optional)","")}${field("by","Done by",it.lastBy||"Me")}
    <label class="f full">Note<textarea id="f-note" name="note" placeholder="Optional"></textarea></label>
    ${it.usesPerChange?`<label class="restock-toggle full" style="font-size:.9rem;color:var(--ink)"><input type="checkbox" id="f-useStock" name="useStock" ${stockOk?"checked":""}> Take ${esc(it.usesPerChange)} out of stock${p?` (${esc(p.name)}: ${esc(p.onHand||"0")} on hand)`:""}</label>`:""}</div>`,
    async fd=>{
      const iso=fd.date||isoToday(), mdy=isoToMdy(iso), miles=num(fd.miles), cost=num(String(fd.cost||"").replace(/[$,]/g,""));
      const before=clone(latest(v)), nv=clone(latest(v)); let partBefore=null, partAfter=null, used="", msg=`Logged ${it.name} on ${mdy}`;
      nv.items=nv.items.map(i=>{
        if(i.id!==itemId) return i;
        const u={...i,lastBy:(fd.by||"").trim()}; delete u.skipUntil;
        const prev=parseDate(i.lastChanged);
        if(!prev || new Date(iso+"T12:00")>=prev){ u.lastChanged=mdy; if(miles!=null) u.lastMiles=String(miles); }
        if(fd.useStock==="on"){
          const pp=partOf(i), r=useStock(pp?pp.onHand:i.onHand,i.usesPerChange);
          if(r){ used=i.usesPerChange; const was=(pp?pp.onHand:i.onHand)||"0";
            if(pp){ partBefore=clone(pp); partAfter={...clone(pp),onHand:r.text}; if(r.left<=0) partAfter.restock=true; }
            else { u.onHand=r.text; if(r.left<=0) u.restock=true; }
            msg+=`. ${pp?pp.name:i.name}: ${was} → ${r.text}`; if(r.left<=0) msg+=" (added to shopping list)"; }
        }
        return u; });
      if(miles!=null && (num(nv.odometer)==null || miles>num(nv.odometer))){ nv.odometer=String(miles); nv.odometerDate=mdy; }
      await save(nv); if(partAfter) await savePart(partAfter);
      let histRef=null;
      try{ histRef=db.collection("history").doc(); await histRef.set({vehicleId:v.id,itemId,itemName:it.name,date:mdy,dateISO:iso,miles:miles!=null?String(miles):"",cost:cost!=null?String(cost):"",by:(fd.by||"").trim(),note:(fd.note||"").trim(),used,partId:it.partId||"",createdAt:new Date().toISOString()}); }
      catch(e){ setStatus("Saved the service, but couldn't add it to history: "+(e.message||e.code)); }
      toast(msg, async()=>{ await save({...clone(latest(before)),...before}); if(partBefore) await savePart(partBefore); if(histRef) try{ await histRef.delete(); }catch{} toast("Undone"); });
    });
}

/* ---------- PDF export ---------- */
/* jsPDF's built-in fonts cover Latin-1 only, so swap anything else for a plain equivalent. */
const pdfText=t=>String(t??"").replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D\u201D]/g,'"').replace(/\u2192/g,"->").replace(/[\u2013\u2014]/g,"-").replace(/[^\x00-\xFF]/g,"");
async function exportPdf(v){
  if(!downloads){ toast("Saving files isn't available on this device"); return; }
  if(!window.jspdf||!window.jspdf.jsPDF){ toast("The PDF tool didn't load. Reload the page and try again"); return; }
  const doc=new window.jspdf.jsPDF({unit:"pt",format:"letter"});
  const W=doc.internal.pageSize.getWidth(), M=40, RED=[158,27,36], INK=[30,30,30], GREY=[110,110,115];
  const title=[v.year,v.make,v.name].filter(Boolean).join(" ");
  doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.setTextColor(...INK); doc.text(pdfText(title),M,56);
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...GREY);
  doc.text(pdfText(`Maintenance record from Bedford Driveway · generated ${today()}`),M,74);
  doc.setDrawColor(...RED); doc.setLineWidth(2); doc.line(M,84,W-M,84);
  const head={fillColor:RED,textColor:255,fontStyle:"bold"}, base={font:"helvetica",fontSize:9,cellPadding:4,textColor:INK,lineColor:[220,220,222],lineWidth:.5};
  const section=(label,y)=>{ doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...INK); doc.text(label,M,y); return y+8; };
  // Vehicle details
  const det=[["Manufacturer",v.make],["Model",v.name],["Year",v.year],["Trim",v.trim],["Engine",v.engine],["Engine code",v.engineCode],["Transmission",v.transmission],["Drivetrain",v.drivetrain],["Body",v.body],["VIN",v.vin],["License plate",v.plate],["Paint",v.paint],
    ["Odometer",num(v.odometer)!=null?`${fmtMi(num(v.odometer))} miles${v.odometerDate?" (as of "+v.odometerDate+")":""}`:""],
    ["Tire size",v.tireSize],["Tire pressure",(v.tirePressureFront||v.tirePressureRear)?`${v.tirePressureFront||"?"} psi front, ${v.tirePressureRear||"?"} psi rear`:""],["Oil capacity",v.oilCapacity],["Coolant",v.coolant]].filter(r=>r[1]);
  let y=section("Vehicle details",108);
  doc.autoTable({startY:y,margin:{left:M,right:M},theme:"grid",styles:base,columnStyles:{0:{fontStyle:"bold",cellWidth:120,fillColor:[244,244,245]}},body:det.map(r=>[r[0],pdfText(r[1])])});
  // Maintenance by category
  y=section("Maintenance schedule",doc.lastAutoTable.finalY+28);
  const rows=[];
  svcGroups(v.items||[]).forEach(([cat,list])=>{
    rows.push([{content:cat,colSpan:6,styles:{fontStyle:"bold",fillColor:[236,236,238],textColor:INK}}]);
    list.forEach(it=>{ const d=dueInfo(it,v);
      rows.push([it.name, it.spec||"", [it.lastChanged, num(it.lastMiles)!=null?fmtMi(num(it.lastMiles))+" mi":""].filter(Boolean).join("\n"),
        d?(d.state==="none"?"No record":`${d.label}\n${d.detail}`):"", intervalText(it), it.notes||""].map(pdfText)); });
  });
  doc.autoTable({startY:y,margin:{left:M,right:M},theme:"grid",styles:base,headStyles:head,
    head:[["Item","Spec / part","Last changed","Next due","Interval","Notes"]],body:rows,
    columnStyles:{0:{cellWidth:78,fontStyle:"bold"},1:{cellWidth:92},2:{cellWidth:70},3:{cellWidth:78},4:{cellWidth:70}},
    didParseCell:h=>{ if(h.section==="body"&&h.column.index===3){ const t=String(h.cell.raw||""); if(t.startsWith("Overdue")) h.cell.styles.textColor=RED; } }});
  // Service history
  const hist=history.filter(h=>h.vehicleId===v.id).sort((a,b)=>String(b.dateISO).localeCompare(String(a.dateISO)));
  y=section("Service history",doc.lastAutoTable.finalY+28);
  if(hist.length){
    const total=hist.reduce((t,h)=>t+(num(h.cost)||0),0);
    doc.autoTable({startY:y,margin:{left:M,right:M},theme:"grid",styles:base,headStyles:head,
      head:[["Date","Service","Mileage","Cost","Done by","Note"]],
      body:hist.map(h=>[h.date,h.itemName+(h.used?` (used ${h.used})`:""),num(h.miles)!=null?fmtMi(num(h.miles)):"",num(h.cost)!=null?money(num(h.cost)):"",h.by||"",h.note||""].map(pdfText)),
      foot:total?[["","","Total",money(total),"",""]]:undefined, footStyles:{fillColor:[244,244,245],textColor:INK,fontStyle:"bold"},
      columnStyles:{0:{cellWidth:62},1:{cellWidth:110},2:{cellWidth:58,halign:"right"},3:{cellWidth:52,halign:"right"},4:{cellWidth:80}}});
  } else { doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...GREY); doc.text("No service logged yet.",M,y+12); }
  // Page numbers
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...GREY);
    doc.text(pdfText(title),M,doc.internal.pageSize.getHeight()-24); doc.text(`Page ${i} of ${n}`,W-M,doc.internal.pageSize.getHeight()-24,{align:"right"}); }
  const fname=`${[v.year,v.make,v.name].filter(Boolean).join(" ").replace(/[^A-Za-z0-9]+/g,"-")}-records-${today().replace(/\//g,"-")}.pdf`;
  try{ await downloads.save({filename:fname,data:doc.output("blob")}); toast("PDF saved"); }
  catch(e){ if(e&&e.code==="declined") return; if(e&&e.code==="rate_limited"){ toast("A save prompt is already open"); return; } toast("Couldn't save the PDF here"); }
}

/* ---------- events ---------- */
$("#v-service").onclick=()=>{view="service";try{localStorage.setItem("gl-view",view)}catch{};render();};
$("#v-inv").onclick=()=>{view="inv";try{localStorage.setItem("gl-view",view)}catch{};render();};
$("#v-set").onclick=()=>{view="settings";render();openSettings();};
$("#tabs").addEventListener("click",e=>{
  const t=e.target.closest(".tab"); if(!t) return;
  if(t.id==="add-vehicle") return editVehicle(null);
  activeId=t.dataset.id||null; render(); window.scrollTo({top:0});
});
$("#main").addEventListener("click",e=>{
  const j=e.target.closest("[data-jump]"); if(j){ const t=document.getElementById(j.dataset.jump); if(t) t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"}); return; }
  const g=e.target.closest("[data-goto]"); if(g){ activeId=g.dataset.goto; view="service"; try{localStorage.setItem("gl-view",view);localStorage.setItem("gl-active",activeId)}catch{}; render(); window.scrollTo({top:0}); return; }
  const b=e.target.closest("[data-act]"); if(!b) return; const v=active();
  if(b.dataset.act==="add-part") return editPart(null);
  if(b.dataset.act==="edit-part") return editPart(b.dataset.part);
  if(b.dataset.act==="edit-vehicle") editVehicle(v);
  if(b.dataset.act==="add-item") editItem(v,null);
  if(b.dataset.act==="edit-item") editItem(v,b.dataset.item);
  if(b.dataset.act==="done") logService(latest(v),b.dataset.item);
  if(b.dataset.act==="odo") updateMileage(latest(v));
  if(b.dataset.act==="skip"||b.dataset.act==="unskip"){
    const cur=latest(v), it=(cur.items||[]).find(i=>i.id===b.dataset.item); if(!it) return;
    const prev=it.skipUntil||"";
    let until=""; if(b.dataset.act==="skip"){ const d=new Date(); d.setFullYear(d.getFullYear()+1); until=fmtDate(d); }
    const setSkip=val=>{ const nv=clone(latest(v)); nv.items=nv.items.map(i=>{ if(i.id!==it.id) return i; const c={...i}; if(val) c.skipUntil=val; else delete c.skipUntil; return c; }); return save(nv); };
    setSkip(until).then(()=>toast(until?`${it.name} skipped until ${until}`:`${it.name} is back on the schedule`, ()=>setSkip(prev).then(()=>toast("Undone"))));
  }
  if(b.dataset.act==="pdf") exportPdf(latest(v));
  if(b.dataset.act==="more-hist"){ showAllHist=!showAllHist; render(); }
  if(b.dataset.act==="del-hist"){
    if(!b.dataset.armed){ b.dataset.armed=1; b.textContent="Confirm delete"; return; }
    db.doc("history/"+b.dataset.hist).delete().then(()=>toast("Entry deleted")).catch(e=>setStatus("Couldn't delete: "+(e.message||e.code)));
  }
  if(b.dataset.act==="copy-shop"){
    const txt=shopText();
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Shopping list copied")).catch(()=>{
      openModal(`<h2>Shopping list</h2><textarea id="f-shoptext" style="min-height:160px">${esc(txt)}</textarea><p class="form-hint">Select the text and copy it.</p>`,()=>{});
      const ta=$("#f-shoptext"); ta.focus(); ta.select(); });
  }
});
$("#main").addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".ov-card")){ e.preventDefault(); e.target.click(); } });
$("#main").addEventListener("change",e=>{
  const t=e.target;
  const pid=t.dataset.partOh||t.dataset.partRs;
  if(pid){ const p=parts.find(x=>x.id===pid); if(!p) return;
    savePart(t.dataset.partOh?{...clone(p),onHand:withUnit(t.value,p.unit)}:{...clone(p),restock:t.checked}, "Inventory updated"); return; }
  const key=t.dataset.inv||t.dataset.restock; if(!key) return;
  const [vid,iid]=key.split("|"); const v=vehicles.find(x=>x.id===vid); if(!v) return;
  const nv=clone(v);
  nv.items=nv.items.map(i=>i.id!==iid?i:(t.dataset.inv?{...i,onHand:t.value.trim()}:{...i,restock:t.checked}));
  save(nv,"Inventory updated");
});

/* ---------- settings, people and notifications (server build only) ---------- */
const ROLE_LABEL={owner:"Owner",editor:"Editor",viewer:"Viewer"};
const PREF_LABEL=[
  ["overdue","Overdue maintenance","On the day an item goes overdue, then weekly until it's logged."],
  ["dueSoon","Coming due","Once, about two weeks or 500 miles ahead."],
  ["outOfStock","Parts out of stock","When a logged service uses the last of a part."],
  ["mileage","Mileage check-in","Monthly reminder to update the odometer on daily drivers."],
  ["allVehicles","Include non-daily drivers","Also send reminders for vehicles not marked as daily drivers."],
];
let people=null, pushState="unknown", settingsBusy=false;
const me=()=>window.DRIVEWAY.me||{};
const sapi=(m,u,b)=>window.DRIVEWAY.api(m,u,b);
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function b64u(s){ const p="=".repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b,c=>c.charCodeAt(0)); }
function deviceName(){ const ua=navigator.userAgent; return (/iPhone/.test(ua)?"iPhone":/iPad/.test(ua)||isIOS?"iPad":/Android/.test(ua)?"Android":/Mac/.test(ua)?"Mac":/Windows/.test(ua)?"Windows":"Browser")+(standalone?" (Home Screen app)":" (browser)"); }

async function checkPush(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){ pushState=isIOS&&!standalone?"needs-install":"unsupported"; return; }
  if(Notification.permission==="denied"){ pushState="denied"; return; }
  try{ const reg=await navigator.serviceWorker.ready; pushState=(await reg.pushManager.getSubscription())?"on":"off"; }catch{ pushState="off"; }
}

async function enablePush(){
  // requestPermission must be the first thing awaited after the tap (iOS rule)
  let perm; try{ perm=await Notification.requestPermission(); }catch{ perm="default"; }
  if(perm!=="granted"){ toast(perm==="denied"?"Notifications are blocked. Turn them on in Settings › Notifications › Driveway.":"Notifications weren't turned on"); await checkPush(); return renderSettings(true); }
  if(!me().pushKey){ toast("Push keys aren't set up on the server yet"); return; }
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(me().pushKey)});
    await sapi("POST","/api/push/subscribe",{subscription:sub.toJSON(),device:deviceName()});
    toast("Notifications are on for this device");
  }catch(e){ toast("Couldn't turn on notifications: "+(e.message||e)); }
  await refreshMe(); await checkPush(); renderSettings(true);
}
async function disablePush(){
  try{ const reg=await navigator.serviceWorker.ready, sub=await reg.pushManager.getSubscription();
    if(sub){ await sapi("POST","/api/push/unsubscribe",{endpoint:sub.endpoint}); await sub.unsubscribe(); }
    toast("Notifications are off for this device");
  }catch(e){ toast("Couldn't turn off notifications"); }
  await refreshMe(); await checkPush(); renderSettings(true);
}
async function refreshMe(){ try{ window.DRIVEWAY.me=await sapi("GET","/api/me"); }catch{} }
async function loadPeople(){ if(me().role!=="owner") return; try{ people=await sapi("GET","/api/users"); }catch{ people=[]; } }

function fmtLogin(s){ if(!s) return "Hasn't signed in yet"; const d=new Date(s.replace(" ","T")+(/[zZ]|[+-]\d\d:?\d\d$/.test(s)?"":"Z")); return isNaN(d)?"":"Last signed in "+fmtDate(d); }

function settingsView(){
  const u=me(), p=u.prefs||{};
  const pushBlock={
    "on":`<p>Notifications are <b>on</b> for this device.</p><div class="set-row"><button class="btn" data-sact="push-test">Send a test</button><button class="btn" data-sact="push-off">Turn off on this device</button></div>`,
    "off":`<p>Get reminders on this device when maintenance comes due.</p><div class="set-row"><button class="btn primary" data-sact="push-on">Turn on notifications</button></div>`,
    "denied":`<p>Notifications are blocked for this app. ${isIOS?"Open Settings › Notifications › Driveway on your iPhone to allow them.":"Allow them in your browser's site settings, then reload."}</p>`,
    "needs-install":`<p>On iPhone, notifications work once the app is on your Home Screen: in Safari, tap <b>Share</b>, then <b>Add to Home Screen</b>, then open Driveway from the Home Screen and come back here. Requires iOS 16.4 or later.</p>`,
    "unsupported":`<p>This browser doesn't support web notifications.</p>`,
    "unknown":`<p>Checking this device…</p>`,
  }[pushState];
  const others=u.devices&&pushState!=="on"?u.devices:u.devices-1;
  const prefs=PREF_LABEL.map(([k,l,h])=>`<label class="set-pref"><input type="checkbox" data-pref="${k}" ${p[k]?"checked":""}><span><b>${l}</b><small>${h}</small></span></label>`).join("");
  const owner=u.role==="owner";
  const peopleBlock=!owner?"":`<section class="plate" id="set-people"><h2 class="set-h">People</h2>
    <p class="form-hint">Only people listed here can sign in. Editors can log service and update inventory; viewers can only look; owners also manage people and vehicles.</p>
    ${people===null?`<p>Loading…</p>`:`<ul class="set-people">${people.map(x=>`<li>
      ${x.picture?`<img src="${esc(x.picture)}" alt="" referrerpolicy="no-referrer">`:`<span class="set-av">${esc((x.name||x.email)[0].toUpperCase())}</span>`}
      <span class="set-who"><b>${esc(x.name||x.email)}</b><small>${esc(x.name?x.email+" · ":"")}${esc(fmtLogin(x.lastLogin))}${x.devices?` · ${x.devices} device${x.devices>1?"s":""} with notifications`:""}</small></span>
      ${x.id===u.id?`<span class="chip">${ROLE_LABEL[x.role]} (you)</span>`:`<select data-role="${x.id}" aria-label="Role for ${esc(x.email)}">${Object.entries(ROLE_LABEL).map(([r,l])=>`<option value="${r}" ${r===x.role?"selected":""}>${l}</option>`).join("")}</select>
      <button class="btn danger" data-sact="remove" data-uid="${x.id}">Remove</button>`}</li>`).join("")}</ul>`}
    <form class="set-invite" id="set-invite"><input type="email" id="inv-email" placeholder="name@gmail.com" required aria-label="Email address to invite">
      <select id="inv-role" aria-label="Role"><option value="editor">Editor</option><option value="viewer">Viewer</option><option value="owner">Owner</option></select>
      <button class="btn primary" type="submit">Invite</button></form>
    <p class="form-hint">They sign in at driveway.oaksync.com with that Google account. No email is sent, so let them know.</p></section>`;
  return `<section class="plate"><h2 class="set-h">Account</h2>
      <div class="set-me">${u.picture?`<img src="${esc(u.picture)}" alt="" referrerpolicy="no-referrer">`:""}<span class="set-who"><b>${esc(u.name||u.email)}</b><small>${esc(u.email)} · ${ROLE_LABEL[u.role]||""}</small></span>
      <a class="btn" href="/auth/logout">Sign out</a></div>
      ${owner?`<p class="form-hint"><a href="/api/export" download>Download a backup</a> of all vehicles, parts and service history (JSON).</p>`:""}</section>
    <section class="plate"><h2 class="set-h">Notifications</h2>${pushBlock}
      ${others>0?`<p class="form-hint">Also on for ${others} other device${others>1?"s":""}.</p>`:""}
      <fieldset class="set-prefs"><legend>Send me</legend>${prefs}</fieldset></section>
    ${peopleBlock}`;
}
function renderSettings(force){
  if(view!=="settings") return;
  if(!force&&(settingsBusy||$("#main").contains(document.activeElement)&&document.activeElement.matches("input,select"))) return;
  $("#main").innerHTML=settingsView();
}
async function openSettings(){ await Promise.all([checkPush(),loadPeople(),refreshMe()]); renderSettings(true); }

$("#main").addEventListener("click",async e=>{
  const b=e.target.closest("[data-sact]"); if(!b||view!=="settings") return;
  const a=b.dataset.sact;
  if(a==="push-on") return enablePush();
  if(a==="push-off") return disablePush();
  if(a==="push-test"){ try{ const r=await sapi("POST","/api/push/test"); toast(r.sent?"Test sent":"No devices to send to"); }catch(err){ toast(err.message||"Couldn't send a test"); } return; }
  if(a==="remove"){
    if(!b.dataset.armed){ b.dataset.armed=1; b.textContent="Confirm remove"; return; }
    try{ await sapi("DELETE","/api/users/"+b.dataset.uid); toast("Access removed"); await loadPeople(); renderSettings(true); }catch(err){ toast(err.message||"Couldn't remove"); }
  }
});
$("#main").addEventListener("change",async e=>{
  if(view!=="settings") return; const t=e.target;
  if(t.dataset.pref){ try{ const r=await sapi("PATCH","/api/me/prefs",{[t.dataset.pref]:t.checked}); window.DRIVEWAY.me.prefs=r.prefs; toast("Saved"); }catch(err){ t.checked=!t.checked; toast(err.message||"Couldn't save"); } return; }
  if(t.dataset.role){ try{ await sapi("PATCH","/api/users/"+t.dataset.role,{role:t.value}); toast("Role updated"); await loadPeople(); renderSettings(true); }catch(err){ toast(err.message||"Couldn't change role"); await loadPeople(); renderSettings(true); } }
});
$("#main").addEventListener("submit",async e=>{
  if(e.target.id!=="set-invite") return; e.preventDefault();
  settingsBusy=true;
  try{ const em=$("#inv-email").value.trim(); await sapi("POST","/api/users",{email:em,role:$("#inv-role").value}); toast(em+" can now sign in"); await loadPeople(); }
  catch(err){ toast(err.message||"Couldn't invite"); }
  settingsBusy=false; renderSettings(true);
});

/* Deep links from notifications: #inventory, #settings, #v-<vehicleId> */
function applyHash(){
  const h=decodeURIComponent(location.hash.slice(1)); if(!h) return false;
  if(h==="inventory") view="inv";
  else if(h==="settings") view="settings";
  else if(h.startsWith("v-")){ view="service"; activeId=h.slice(2); }
  else return false;
  window.history.replaceState(null,"",location.pathname); // keep later navigation clean
  if(view==="settings") openSettings();
  return true;
}
window.addEventListener("hashchange",()=>{ if(applyHash()) { render(); window.scrollTo({top:0}); } });

/* ---------- boot ---------- */
(async()=>{
  window.claude?.use?.("downloads").then(d=>{ downloads=d; if(d) render(); }).catch(()=>{});
  db = await window.claude?.use?.("db");
  if(!db){ $("#main").innerHTML=`<div class="plate empty">Couldn't reach the server. Check your connection and reload.</div>`; $("#tabs").innerHTML=""; return; }
  try{ const u=await window.claude.use("user"); const w=u?await u.can("data.write"):null; if(w===false) canWrite=false; }catch{}
  if(view==="settings") view="service";
  applyHash();
  db.collection("history").onSnapshot(snap=>{
    history = snap.docs.map(d=>({id:d.id,...clone(d.data())}));
    render();
  }, err=>setStatus("Live updates stopped ("+err.code+"). Reload the page to reconnect."));
  db.collection("parts").onSnapshot(snap=>{
    parts = snap.docs.map(d=>({id:d.id,...clone(d.data())}));
    const ae=document.activeElement; if(ae&&ae.dataset&&ae.dataset.partOh) return;
    render();
  }, err=>setStatus("Live updates stopped ("+err.code+"). Reload the page to reconnect."));
  db.collection("vehicles").orderBy("order").onSnapshot(snap=>{
    vehicles = snap.docs.map(d=>({id:d.id,...clone(d.data())}));
    // keep inputs stable while someone is typing in inventory
    const ae=document.activeElement; if(ae&&ae.dataset&&ae.dataset.inv) return;
    render();
  }, err=>setStatus("Live updates stopped ("+err.code+"). Reload the page to reconnect."));
})();
</script>
